spring.application.name=notification-service

# Configuración para PostgreSQL LOCAL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# URL donde Eureka Server estará escuchando (el puerto 8761 es el estándar)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nombre de la cola que escucharemos (debe coincidir con la que envía el otro micro)
app.rabbitmq.queue=notificaciones.queue