spring.application.name=notification-service
server.port=8081

# Configuración para PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://postgres-db:5432/notification_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka deshabilitado para desarrollo local
eureka.client.enabled=false

# Configuración RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nombre de la cola que escucharemos (debe coincidir con la que envía el otro micro)
app.rabbitmq.queue=notificaciones.queue