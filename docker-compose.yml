version: '3.8'
services:
  # Base de Datos PostgreSQL
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  # RabbitMQ con Panel de Control
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Puerto para recibir mensajes
      - "15672:15672" # Puerto para ver la interfaz web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Tu Microservicio de Notificaciones
  notification-ms:
    build: .
    container_name: notification-ms
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
      - rabbitmq
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/notification_db
      - SPRING_RABBITMQ_HOST=rabbitmq